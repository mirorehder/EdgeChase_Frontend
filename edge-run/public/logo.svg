<?xml version="1.0" encoding="UTF-8"?>
<!--
  EDGE CHASE – Markenzeichen (geometrischer Nachbau / Platzhalter).
  Zwei ineinandergreifende, punktsymmetrische Spiralarme auf einem 45°-Raster
  ergeben das labyrinthartige Sechseck-Motiv mit den zwei gegenüberliegenden
  "Tabs" (oben-links / unten-rechts) und dem massiven Zentrum.

  >>> ECHTES LOGO EINSETZEN <<<
  Diese Datei einfach durch die offizielle Vektordatei ersetzen (gleicher
  Dateiname) ODER eine "logo.png" mit transparentem Hintergrund daneben legen –
  das Spiel bevorzugt automatisch die PNG, falls vorhanden (siehe src/game.js).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Edge Chase">
  <g transform="translate(50,50) rotate(45) scale(10.4)" fill="none" stroke="#0a0a0a"
     stroke-width="0.6" stroke-linejoin="miter" stroke-linecap="butt">
    <polyline points="0,0 1,0 1,1 -1,1 -1,-1 2,-1 2,2 -2,2 -2,-2 3,-2 3,3"/>
    <polyline points="0,0 -1,0 -1,-1 1,-1 1,1 -2,1 -2,-2 2,-2 2,2 -3,2 -3,-3"/>
  </g>
</svg>
